<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ECEEF2" />
    <title>Hindcast</title>
    <script>
      // Apply the person's look before the first paint so the page doesn't flash.
      try {
        var l = JSON.parse(localStorage.getItem('look') || '{}')
        var t = l.theme === 'light' || l.theme === 'dark' ? l.theme : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (/^#[0-9a-fA-F]{6}$/.test(l.hex || '')) document.documentElement.style.setProperty('--accent', l.hex)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
